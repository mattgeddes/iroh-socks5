[package]
name = "iroh-socks5"
version = "0.5.0"
edition = "2021"
rust-version = "1.91"
description = "A SOCKS5 proxy protocol over iroh"
license = "MIT OR Apache-2.0"

[features]
default = ["dns-over-https"]
test-utils = [
    "iroh/test-utils",
    "dep:iroh-relay",
    "dep:h2",
    "dep:http",
    "dep:hickory-proto",
    "dep:rcgen",
    "dep:rustls",
    "dep:serde_json",
    "dep:tokio-rustls",
]
dns-over-https = [
    "dep:serde_json",
    "hickory-resolver/https-ring",
    "hickory-resolver/webpki-roots",
    "hickory-resolver/serde",
]

[dependencies]
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
h2 = { version = "0.4", optional = true }
hickory-proto = { version = "0.26.1", optional = true }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
http = { version = "1", optional = true }
iroh = "=1.0.3"
iroh-relay = { version = "=1.0.3", optional = true }
postcard = { version = "1", features = ["use-std"] }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
